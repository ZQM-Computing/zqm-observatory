name: Disposable PostGIS handoff

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-postgis-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: observatory_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d observatory_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned PostgreSQL driver
        run: python -m pip install "psycopg[binary]==3.2.9"
      - name: Build deterministic synthetic product
        run: python scripts/build_synthetic_product.py --output-dir build/synthetic-product
      - name: Load and verify synthetic features in disposable PostGIS
        env:
          OBSERVATORY_POSTGIS_DISPOSABLE: "1"
          OBSERVATORY_NORMALIZED_GEOJSON: build/synthetic-product/normalized.geojson
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: observatory_test
          PGUSER: postgres
          PGPASSWORD: postgres
        run: python scripts/run_postgis_handoff.py
