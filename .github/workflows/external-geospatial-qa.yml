name: External geospatial QA handoff

on:
  pull_request:
    paths:
      - "scripts/run_qgis_dataset_qa_handoff.py"
      - "tests/test_qgis_dataset_qa_handoff.py"
      - "tests/fixtures/synthetic-places.geojson"
      - "docs/geospatial-repository-integration.md"
      - "docs/supporting-repository-crawl.md"
      - ".github/workflows/external-geospatial-qa.yml"
  push:
    branches: [main]
    paths:
      - "scripts/run_qgis_dataset_qa_handoff.py"
      - "tests/test_qgis_dataset_qa_handoff.py"
      - "tests/fixtures/synthetic-places.geojson"
      - "docs/geospatial-repository-integration.md"
      - "docs/supporting-repository-crawl.md"
      - ".github/workflows/external-geospatial-qa.yml"

permissions:
  contents: read

concurrency:
  group: external-geospatial-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapter-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test adapter contracts without GDAL or network
        run: python -m unittest tests.test_qgis_dataset_qa_handoff -v

  pinned-qgis-resources-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned qgis-resources implementation
        uses: actions/checkout@v4
        with:
          repository: ZQM-Computing/qgis-resources
          ref: 004d037da5301264d3f2ac462d835f2d5c75f8cb
          path: support/qgis-resources
          persist-credentials: false
      - name: Install GDAL runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gdal-bin python3-gdal
      - name: Run pinned external QA twice against synthetic fixture
        run: |
          /usr/bin/python3 scripts/run_qgis_dataset_qa_handoff.py \
            --qa-script support/qgis-resources/scripts/dataset_qa.py \
            --fixture tests/fixtures/synthetic-places.geojson \
            --output-dir build/qgis-dataset-qa-handoff \
            --producer-commit 004d037da5301264d3f2ac462d835f2d5c75f8cb
      - name: Upload reproducible handoff evidence
        uses: actions/upload-artifact@v4
        with:
          name: qgis-dataset-qa-handoff
          path: build/qgis-dataset-qa-handoff/
          if-no-files-found: error
          retention-days: 14
