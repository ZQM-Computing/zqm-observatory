name: PostGIS handoff

on:
  pull_request:
    paths:
      - "scripts/run_postgis_handoff.py"
      - "tests/test_postgis_handoff.py"
      - "tests/fixtures/synthetic-places.geojson"
      - "docs/geospatial-repository-integration.md"
      - ".github/workflows/postgis-handoff.yml"
  push:
    branches: [main]
    paths:
      - "scripts/run_postgis_handoff.py"
      - "tests/test_postgis_handoff.py"
      - "tests/fixtures/synthetic-places.geojson"
      - "docs/geospatial-repository-integration.md"
      - ".github/workflows/postgis-handoff.yml"

permissions:
  contents: read

concurrency:
  group: postgis-handoff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test fixture and aggregate contracts without a database
        run: python -m unittest discover -s tests -p 'test_postgis_handoff.py' -v

  pinned-postgis-cookbook-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: observatory_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d observatory_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned PostGIS cookbook
        uses: actions/checkout@v4
        with:
          repository: ZQM-Computing/postgis-cookbook
          ref: eda8d7ab9379d1c43f55666260ad693868137537
          path: support/postgis-cookbook
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL client and pinned Python driver
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-client
          python -m pip install --disable-pip-version-check "psycopg[binary]==3.2.9"
      - name: Load synthetic fixture and execute pinned cookbook RLS pattern
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: observatory_ci
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          python scripts/run_postgis_handoff.py \
            --fixture tests/fixtures/synthetic-places.geojson \
            --output-dir build/postgis-handoff \
            --cookbook-dir support/postgis-cookbook \
            --cookbook-commit eda8d7ab9379d1c43f55666260ad693868137537
      - name: Upload reproducible PostGIS handoff evidence
        uses: actions/upload-artifact@v4
        with:
          name: postgis-handoff
          path: build/postgis-handoff/
          if-no-files-found: error
          retention-days: 14
