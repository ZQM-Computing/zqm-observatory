name: Product validation

on:
  pull_request:
    paths:
      - "data/**"
      - "docs/first-product-release-gate.md"
      - "docs/methods.md"
      - "docs/roadmap.md"
      - "docs/product-standard.md"
      - "docs/source-rights-review.md"
      - "docs/source-rights-register.md"
      - "docs/item-level-source-audit.md"
      - "docs/metadata-only-source-preflight.md"
      - "config/source-rights.json"
      - "templates/**"
      - "scripts/validate_products.py"
      - "scripts/build_synthetic_product.py"
      - "scripts/verify_synthetic_provenance.py"
      - "scripts/compare_product_runs.py"
      - "scripts/baseline_registry.py"
      - "scripts/evaluate_change_release.py"
      - "config/release-gate-rules.example.json"
      - "config/change-review-rules.example.json"
      - "docs/synthetic-pipeline.md"
      - "scripts/validate_source_rights.py"
      - "scripts/audit_source_metadata.py"
      - "tests/**"
      - ".github/workflows/product-validation.yml"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "docs/first-product-release-gate.md"
      - "docs/methods.md"
      - "docs/roadmap.md"
      - "docs/product-standard.md"
      - "docs/source-rights-review.md"
      - "docs/source-rights-register.md"
      - "docs/item-level-source-audit.md"
      - "docs/metadata-only-source-preflight.md"
      - "config/source-rights.json"
      - "templates/**"
      - "scripts/validate_products.py"
      - "scripts/build_synthetic_product.py"
      - "scripts/verify_synthetic_provenance.py"
      - "scripts/compare_product_runs.py"
      - "docs/synthetic-pipeline.md"
      - "scripts/validate_source_rights.py"
      - "scripts/audit_source_metadata.py"
      - "tests/**"
      - ".github/workflows/product-validation.yml"

permissions:
  contents: read

jobs:
  product-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run validator unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate source rights register
        run: python scripts/validate_source_rights.py
      - name: Verify metadata preflight CLI
        run: python scripts/audit_source_metadata.py --help
      - name: Validate published product bundles
        run: python scripts/validate_products.py
      - name: Run deterministic synthetic pipeline
        run: python scripts/build_synthetic_product.py --output-dir build/synthetic-product --bundle-dir build/synthetic-product-bundle
      - name: Verify synthetic provenance and change detection
        run: python scripts/verify_synthetic_provenance.py --input tests/fixtures/synthetic-places.geojson --output-dir build/synthetic-product
      - name: Smoke-test baseline registry and product change report
        run: |
          python scripts/baseline_registry.py register --registry build/baseline-registry.json --run-id synthetic-v1 --dataset build/synthetic-product/normalized.geojson --pipeline-version 0.1.0 --description "CI synthetic fixture"
          python scripts/compare_product_runs.py --before build/synthetic-product/normalized.geojson --before-id synthetic-v1 --after build/synthetic-product/normalized.geojson --after-id synthetic-v1 --registry build/baseline-registry.json --output build/change-report/self-comparison.json
      - name: Smoke-test change release gate
        run: python scripts/evaluate_change_release.py --report build/change-report/self-comparison.json --rules-json config/release-gate-rules.example.json --output build/change-report/release-gate.json
